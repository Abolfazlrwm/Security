name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools:
    name: Python tools (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile every tool
        run: python -m compileall subdomain-enum hashcrack recon-pipeline port-scanner takeover-check web-audit jwt-analyzer cve-lookup

      - name: hashcrack smoke test (plain lookup)
        run: |
          python3 hashcrack/hashcrack.py --hash 5f4dcc3b5aa765d61d8327deb882cf99

      - name: hashcrack smoke test (rule chain)
        run: |
          python3 hashcrack/hashcrack.py --hash 0d491297649a8a4f7768f3e5784c52f1 --rules capitalize,append4

      - name: CLI help pages
        run: |
          python3 subdomain-enum/subdomain_enum.py --help > /dev/null
          python3 port-scanner/port_scanner.py --help > /dev/null
          python3 takeover-check/takeover_check.py --help > /dev/null
          python3 web-audit/web_audit.py --help > /dev/null
          python3 jwt-analyzer/jwt_analyzer.py --help > /dev/null
          python3 cve-lookup/cve_lookup.py --help > /dev/null
          python3 recon-pipeline/recon.py --help > /dev/null

      - name: jwt-analyzer smoke test (offline token audit)
        run: |
          token=$(cat examples/jwt-analyzer/weak-hs256.txt)
          python3 jwt-analyzer/jwt_analyzer.py "$token" --no-crack --now 2026-11-16T00:00:00Z > /dev/null
          python3 jwt-analyzer/jwt_analyzer.py "$token" | grep -q 'CRACKED'
          python3 jwt-analyzer/jwt_analyzer.py "$(cat examples/jwt-analyzer/alg-none.txt)" | grep -q 'CRITICAL'

      - name: port-scanner smoke test (localhost)
        run: |
          python3 port-scanner/port_scanner.py 127.0.0.1 --ports 9 --timeout 0.5 --no-banner

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v

  go-tool:
    name: Go tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dirbrute
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Windows runners check out with CRLF by default, which makes gofmt
      # flag every file; force LF before the working tree exists.
      - name: Configure git line endings
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: dirbrute/go.sum

      - name: gofmt check
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build -o dirbrute .

  integration:
    name: Integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: dirbrute/go.sum

      - name: Build dirbrute
        run: make build

      - name: Unit tests
        run: python3 -m unittest discover -s tests/unit

      - name: Run integration harness
        run: python3 tests/integration.py
