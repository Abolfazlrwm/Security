name: Release binaries

on:
  push:
    tags:
      - "dirbrute-v*"
      - "subdomain-enum-v*"
      - "hashcrack-v*"
      - "port-scanner-v*"
      - "takeover-check-v*"
      - "web-audit-v*"
      - "jwt-analyzer-v*"
      - "cve-lookup-v*"

permissions:
  contents: write

jobs:
  dirbrute:
    name: Build and attach dirbrute binaries
    if: startsWith(github.ref_name, 'dirbrute-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: dirbrute/go.sum

      - name: Cross-compile release binaries
        shell: bash
        env:
          TARGETS: "linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
        run: |
          VERSION="${GITHUB_REF_NAME#dirbrute-v}"
          cd dirbrute
          for target in $TARGETS; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            exe=""
            [ "$goos" = "windows" ] && exe=".exe"
            echo "building dirbrute-${VERSION}-${goos}-${goarch}${exe}"
            GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w" \
              -o "dirbrute-${VERSION}-${goos}-${goarch}${exe}" .
          done
          sha256sum dirbrute-* > checksums.txt

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dirbrute/dirbrute-*
            dirbrute/checksums.txt
          fail_on_unmatched_files: true

  plan:
    name: Pick the Python tool for this tag
    runs-on: ubuntu-latest
    outputs:
      tool: ${{ steps.pick.outputs.tool }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          platforms='[
            {"os": "ubuntu-latest",  "platform": "linux-x86_64"},
            {"os": "macos-latest",   "platform": "macos-arm64"},
            {"os": "windows-latest", "platform": "windows-x86_64"}
          ]'
          case "${GITHUB_REF_NAME}" in
            subdomain-enum-v*) tool="subdomain-enum";;
            hashcrack-v*)      tool="hashcrack";;
            port-scanner-v*)   tool="port-scanner";;
            takeover-check-v*) tool="takeover-check";;
            web-audit-v*)      tool="web-audit";;
            jwt-analyzer-v*)   tool="jwt-analyzer";;
            cve-lookup-v*)     tool="cve-lookup";;
            *)                 tool="";;
          esac
          if [ -n "$tool" ]; then
            # one matrix entry per platform, all pinned to the released tool
            matrix=$(PLATFORMS="$platforms" TOOL="$tool" python3 -c "import json, os; ps = json.loads(os.environ['PLATFORMS']); print(json.dumps([dict(tool=os.environ['TOOL'], **p) for p in ps]))")
          else
            matrix="[]"
          fi
          echo "tool=$tool" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "releasing: $tool, matrix: $matrix"

  python-tool:
    name: Build ${{ matrix.tool }} (${{ matrix.platform }})
    if: needs.plan.outputs.tool != ''
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install "pyinstaller>=6,<7"

      - name: Build standalone binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#*-v}"
          case "${{ matrix.tool }}" in
            subdomain-enum) SCRIPT="subdomain-enum/subdomain_enum.py";;
            hashcrack)      SCRIPT="hashcrack/hashcrack.py";;
            port-scanner)   SCRIPT="port-scanner/port_scanner.py";;
            takeover-check) SCRIPT="takeover-check/takeover_check.py";;
            web-audit)      SCRIPT="web-audit/web_audit.py";;
            jwt-analyzer)   SCRIPT="jwt-analyzer/jwt_analyzer.py";;
            cve-lookup)     SCRIPT="cve-lookup/cve_lookup.py";;
            *) echo "unknown tool: ${{ matrix.tool }}"; exit 1;;
          esac
          pyinstaller --onefile --clean --noconfirm \
            --name "${{ matrix.tool }}-${VERSION}-${{ matrix.platform }}" "$SCRIPT"

      - name: Smoke test the binary
        shell: bash
        run: ./dist/${{ matrix.tool }}-* --help > /dev/null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-${{ matrix.platform }}
          path: dist/${{ matrix.tool }}-*
          if-no-files-found: error

  python-tool-release:
    name: Attach ${{ needs.plan.outputs.tool }} binaries to the release
    if: needs.plan.outputs.tool != ''
    needs: [plan, python-tool]
    runs-on: ubuntu-latest
    steps:
      - name: Collect built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum ${{ needs.plan.outputs.tool }}-* > checksums.txt

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ needs.plan.outputs.tool }}-*
            dist/checksums.txt
          fail_on_unmatched_files: true
